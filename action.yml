name: 'HexPic ASCII Art Generator'
description: 'Generate crisp vector ASCII art SVGs for your GitHub profile README and docs'
author: 'Daniel Kinnito'
branding:
  icon: 'image'
  color: 'purple'

inputs:
  image:
    description: 'Image path or remote URL. Defaults to the repository owner avatar (https://github.com/<owner>.png)'
    required: false
    default: ''
  output:
    description: 'Output SVG file path'
    required: false
    default: './assets/hexpic.svg'
  width:
    description: 'Character width in columns'
    required: false
    default: '70'
  height:
    description: 'Character height in rows (optional, defaults to automatic aspect ratio)'
    required: false
    default: ''
  color-mode:
    description: 'Color mode: color or monochrome'
    required: false
    default: 'color'
  dithering:
    description: 'Dithering algorithm: atkinson, floyd-steinberg, bayer, halftone, random, or none'
    required: false
    default: 'atkinson'
  charset:
    description: 'Charset preset (normal, minimalist, alphabetic, numerical, extended, math, braille) or custom string'
    required: false
    default: 'normal'
  font-size:
    description: 'Monospace font size in pixels for SVG rendering'
    required: false
    default: '12'
  bg-color:
    description: 'Background color hex for SVG'
    required: false
    default: '#000000'
  fg-color:
    description: 'Foreground text color hex for monochrome SVG'
    required: false
    default: '#ffffff'
  contrast:
    description: 'Contrast percentage (e.g. 100)'
    required: false
    default: '100'
  brightness:
    description: 'Brightness percentage (e.g. 100)'
    required: false
    default: '100'
  invert:
    description: 'Invert brightness (true or false)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run HexPic CLI
      shell: bash
      env:
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_WIDTH: ${{ inputs.width }}
        INPUT_HEIGHT: ${{ inputs.height }}
        INPUT_COLOR_MODE: ${{ inputs.color-mode }}
        INPUT_DITHERING: ${{ inputs.dithering }}
        INPUT_CHARSET: ${{ inputs.charset }}
        INPUT_FONT_SIZE: ${{ inputs.font-size }}
        INPUT_BG_COLOR: ${{ inputs.bg-color }}
        INPUT_FG_COLOR: ${{ inputs.fg-color }}
        INPUT_CONTRAST: ${{ inputs.contrast }}
        INPUT_BRIGHTNESS: ${{ inputs.brightness }}
        INPUT_INVERT: ${{ inputs.invert }}
      run: |
        ARGS=()

        if [ -n "$INPUT_IMAGE" ]; then
          ARGS+=("$INPUT_IMAGE")
        fi

        if [ -n "$INPUT_OUTPUT" ]; then
          ARGS+=("-o" "$INPUT_OUTPUT")
        fi

        if [ -n "$INPUT_WIDTH" ]; then
          ARGS+=("-w" "$INPUT_WIDTH")
        fi

        if [ -n "$INPUT_HEIGHT" ]; then
          ARGS+=("--height" "$INPUT_HEIGHT")
        fi

        if [ -n "$INPUT_COLOR_MODE" ]; then
          ARGS+=("-c" "$INPUT_COLOR_MODE")
        fi

        if [ -n "$INPUT_DITHERING" ]; then
          ARGS+=("-d" "$INPUT_DITHERING")
        fi

        if [ -n "$INPUT_CHARSET" ]; then
          ARGS+=("--charset" "$INPUT_CHARSET")
        fi

        if [ -n "$INPUT_FONT_SIZE" ]; then
          ARGS+=("--font-size" "$INPUT_FONT_SIZE")
        fi

        if [ -n "$INPUT_BG_COLOR" ]; then
          ARGS+=("--bg" "$INPUT_BG_COLOR")
        fi

        if [ -n "$INPUT_FG_COLOR" ]; then
          ARGS+=("--fg" "$INPUT_FG_COLOR")
        fi

        if [ -n "$INPUT_CONTRAST" ]; then
          ARGS+=("--contrast" "$INPUT_CONTRAST")
        fi

        if [ -n "$INPUT_BRIGHTNESS" ]; then
          ARGS+=("--brightness" "$INPUT_BRIGHTNESS")
        fi

        if [ "$INPUT_INVERT" = "true" ]; then
          ARGS+=("--invert")
        fi

        node "${{ github.action_path }}/dist/bin/hexpic.js" "${ARGS[@]}"

